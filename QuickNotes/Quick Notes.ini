[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - Quick Notes
Author=Rez Creative (Rezamufaris)
Information=Quick Notes Widget with FrostedGlass Acrylic effect.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[Variables]

[MeasureNotes]
Measure=Plugin
Plugin=QuotePlugin
PathName=#CURRENTPATH#notes.txt
Separator=EOF

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,375,140,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterTitle]
Meter=String
X=20
Y=15
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=9.5
StringStyle=Bold
Text="QUICK NOTES"
AntiAlias=1

[MeterNotesContent]
Meter=String
MeasureName=MeasureNotes
X=20
Y=42
W=335
H=50
ClipString=1
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=8.5
Leading=2
AntiAlias=1

[MeterEditBtnBox]
Meter=Shape
Shape=Rectangle 20,98,335,28,6 | Fill Color #BgInnerColor# | Stroke Color #BorderInnerColor# | StrokeWidth 1

[MeterEditBtnText]
Meter=String
X=187.5
Y=104
StringAlign=Center
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8
Text="Click to edit or add notes"
AntiAlias=1
LeftMouseUpAction=["notepad.exe" "#CURRENTPATH#notes.txt"]
MouseOverAction=[!SetOption MeterEditBtnText FontColor "#AccentCyan#"][!Redraw]
MouseLeaveAction=[!SetOption MeterEditBtnText FontColor "#TextSecondary#"][!Redraw]