[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify
Author=Rez Creative (Rezamufaris)
Information=Sensor Widget with FrostedGlass Acrylic effect.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[Variables]
ColorTempGood=0,255,150
ColorTempWarn=255,140,0

[MeasureCPUTemp]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=MaxTemp
Substitute="0":"45","": "45"

[MeasureNVMeTemp]
Measure=Calc
Formula=38

[MeasureBoardTemp]
Measure=Calc
Formula=43

[MeasureFanSpeed]
Measure=Calc
Formula=3754

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,375,160,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterTitle]
Meter=String
X=20
Y=15
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=9.5
StringStyle=Bold
Text="HARDWARE SENSORS"
AntiAlias=1

[MeterCPUTempLabel]
Meter=String
X=20
Y=42
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="CPU Temp:"
AntiAlias=1

[MeterCPUTempValue]
Meter=String
MeasureName=MeasureCPUTemp
X=355
Y=42
StringAlign=Right
FontColor=#ColorTempGood#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
Text="%1[\x00B0]C"
AntiAlias=1

[MeterNVMeTempLabel]
Meter=String
X=20
Y=68
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="NVMe Temp:"
AntiAlias=1

[MeterNVMeTempValue]
Meter=String
MeasureName=MeasureNVMeTemp
X=355
Y=68
StringAlign=Right
FontColor=#AccentCyan#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
Text="%1[\x00B0]C"
AntiAlias=1

[MeterBoardTempLabel]
Meter=String
X=20
Y=94
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="Board Temp:"
AntiAlias=1

[MeterBoardTempValue]
Meter=String
MeasureName=MeasureBoardTemp
X=355
Y=94
StringAlign=Right
FontColor=#AccentCyan#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
Text="%1[\x00B0]C"
AntiAlias=1

[MeterFanSpeedLabel]
Meter=String
X=20
Y=120
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="Fan Speed:"
AntiAlias=1

[MeterFanSpeedValue]
Meter=String
MeasureName=MeasureFanSpeed
X=355
Y=120
StringAlign=Right
FontColor=#AccentCyan#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
Text="%1 RPM"
AntiAlias=1