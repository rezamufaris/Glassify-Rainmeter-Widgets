[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - Weather Small
Author=Rez Creative (Rezamufaris)
Information=Compact Weather Widget with FrostedGlass Acrylic effect.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[Variables]
CityName=Bekasi
Latitude=-6.2349
Longitude=106.9896

[MeasureWeatherAPI]
Measure=WebParser
Url=https://api.open-meteo.com/v1/forecast?latitude=#Latitude#&longitude=#Longitude#&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto
RegExp="(?siU)"current":\{.*"temperature_2m":(.*),.*"weather_code":(.*)\}.*"daily":\{.*"temperature_2m_max":\[(.*)\].*"temperature_2m_min":\[(.*)\]"
UpdateRate=900

[MeasureTemp]
Measure=WebParser
Url=[MeasureWeatherAPI]
StringIndex=1
RegExpSubstitute=1
Substitute="^(\d+)\..*":"\1"

[MeasureCondition]
Measure=WebParser
Url=[MeasureWeatherAPI]
StringIndex=2
RegExpSubstitute=1
Substitute="^(\d+)\..*":"\1","^0$":"Clear","^1$":"Mainly Clear","^2$":"Partly Cloudy","^3$":"Overcast","^45$":"Fog","^48$":"Fog","^51$":"Drizzle","^53$":"Drizzle","^55$":"Drizzle","^61$":"Slight Rain","^63$":"Moderate Rain","^65$":"Heavy Rain","^80$":"Rain Showers","^81$":"Rain Showers","^82$":"Violent Rain","^95$":"Thunderstorm"

[MeasureTempHigh]
Measure=WebParser
Url=[MeasureWeatherAPI]
StringIndex=3
RegExpSubstitute=1
Substitute="^(\d+)\..*":"\1"

[MeasureTempLow]
Measure=WebParser
Url=[MeasureWeatherAPI]
StringIndex=4
RegExpSubstitute=1
Substitute="^(\d+)\..*":"\1"

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,180,180,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterLocation]
Meter=String
X=20
Y=18
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=11
StringStyle=Bold
Text="#CityName#"
AntiAlias=1

[MeterTempBig]
Meter=String
MeasureName=MeasureTemp
X=18
Y=38
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=34
StringStyle=Light
Text="%1[\x00B0]"
AntiAlias=1

[MeterCondition]
Meter=String
MeasureName=MeasureCondition
X=20
Y=128
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=9
StringStyle=Bold
Text="%1"
AntiAlias=1

[MeterHighLow]
Meter=String
MeasureName=MeasureTempHigh
MeasureName2=MeasureTempLow
X=20
Y=146
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="H:%1[\x00B0]  L:%2[\x00B0]"
AntiAlias=1