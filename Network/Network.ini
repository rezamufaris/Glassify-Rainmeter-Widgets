[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - Network
Author=Rez Creative (Rezamufaris)
Information=Network Widget with FrostedGlass Acrylic effect.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[Variables]
ColorOnline=0,255,150
ColorOffline=255,90,90

ColorDownload=0,240,255
ColorUpload=255,0,128

[MeasureNetIn]
Measure=NetIn
Interface=Best
Cumulative=0

[MeasureNetOut]
Measure=NetOut
Interface=Best
Cumulative=0

[MeasureNetInTotal]
Measure=NetIn
Interface=Best
Cumulative=1

[MeasureNetOutTotal]
Measure=NetOut
Interface=Best
Cumulative=1

[MeasureIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best
Substitute="":"0.0.0.0"

[MeasureSSID]
Measure=Plugin
Plugin=SysInfo
SysInfoType=NET_SSID
SysInfoData=Best
Substitute="":"Ethernet / LAN"

[MeasureInternet]
Measure=Plugin
Plugin=SysInfo
SysInfoType=INTERNET_CONNECTIVITY
SysInfoData=Best
IfCondition=MeasureInternet = 1
IfTrueAction=[!SetOption MeterOnlineText Text "ONLINE"][!SetOption MeterOnlineText FontColor "#ColorOnline#"][!SetOption MeterOnlineDot Shape "Ellipse 0,0,4 | Fill Color #ColorOnline# | Stroke Width 0"][!Redraw]
IfFalseAction=[!SetOption MeterOnlineText Text "OFFLINE"][!SetOption MeterOnlineText FontColor "#ColorOffline#"][!SetOption MeterOnlineDot Shape "Ellipse 0,0,4 | Fill Color #ColorOffline# | Stroke Width 0"][!Redraw]

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,375,185,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterTitle]
Meter=String
X=20
Y=15
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=9.5
StringStyle=Bold
Text="NETWORK SPEED"
AntiAlias=1

[MeterOnlineText]
Meter=String
X=355
Y=14
StringAlign=Right
FontColor=#ColorOnline#
FontFace=#FontMain#
FontSize=8.5
StringStyle=Bold
Text="ONLINE"
AntiAlias=1

[MeterOnlineDot]
Meter=Shape
X=(355 - [MeterOnlineText:W] - 10)
Y=20
Shape=Ellipse 0,0,4 | Fill Color #ColorOnline# | Stroke Width 0
DynamicVariables=1

[MeterDownloadBox]
Meter=Shape
Shape=Rectangle 20,42,162,65,10 | Fill Color #BgInnerColor# | Stroke Color #BorderColor# | StrokeWidth 1

[MeterArrowDown]
Meter=Shape
Shape=Path ArrowPath | Fill Color #ColorDownload# | Stroke Width 0
ArrowPath=32,51 | LineTo 42,51 | LineTo 37,58 | ClosePath 1

[MeterDownloadLabel]
Meter=String
X=47
Y=48
FontColor=#ColorDownload#
FontFace=#FontMain#
FontSize=8.5
StringStyle=Bold
Text="DOWNLOAD"
AntiAlias=1

[MeterDownloadValue]
Meter=String
MeasureName=MeasureNetIn
X=32
Y=68
FontColor=#TextPrimary#
FontFace=#FontMono#
FontSize=11.5
StringStyle=Bold
AutoScale=1
Text="%1B/s"
AntiAlias=1

[MeterUploadBox]
Meter=Shape
Shape=Rectangle 193,42,162,65,10 | Fill Color #BgInnerColor# | Stroke Color #BorderColor# | StrokeWidth 1

[MeterArrowUp]
Meter=Shape
Shape=Path ArrowPath | Fill Color #ColorUpload# | Stroke Width 0
ArrowPath=205,58 | LineTo 215,58 | LineTo 210,51 | ClosePath 1

[MeterUploadLabel]
Meter=String
X=220
Y=48
FontColor=#ColorUpload#
FontFace=#FontMain#
FontSize=8.5
StringStyle=Bold
Text="UPLOAD"
AntiAlias=1

[MeterUploadValue]
Meter=String
MeasureName=MeasureNetOut
X=205
Y=68
FontColor=#TextPrimary#
FontFace=#FontMono#
FontSize=11.5
StringStyle=Bold
AutoScale=1
Text="%1B/s"
AntiAlias=1

[MeterNetText]
Meter=String
MeasureName=MeasureSSID
X=20
Y=120
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="Net: %1"
AntiAlias=1

[MeterIPText]
Meter=String
MeasureName=MeasureIP
X=193
Y=120
FontColor=#ColorUpload#
FontFace=#FontMain#
FontSize=8.5
Text="IP: %1"
AntiAlias=1

[MeterInTotalText]
Meter=String
MeasureName=MeasureNetInTotal
X=20
Y=145
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
AutoScale=1
Text="In: %1B"
AntiAlias=1

[MeterOutTotalText]
Meter=String
MeasureName=MeasureNetOutTotal
X=193
Y=145
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
AutoScale=1
Text="Out: %1B"
AntiAlias=1