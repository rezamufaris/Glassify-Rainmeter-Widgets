[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - System Monitor Simple
Author=Rez Creative (Rezamufaris)
Information=Minimalist macOS Style System Monitor Widget with Multi-Drive Circular Rings.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[MeasureCPU]
Measure=CPU
MinValue=0
MaxValue=100

[MeasureRAMFree]
Measure=PhysicalMemory
InvertMeasure=1

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1

[MeasureRAMFreePercent]
Measure=Calc
Formula=(MeasureRAMFree / MeasureRAMTotal) * 100
MinValue=0
MaxValue=100

[MeasureDiskCFree]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=5

[MeasureDiskCTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=5

[MeasureDiskCFreePercent]
Measure=Calc
Formula=(MeasureDiskCFree / MeasureDiskCTotal) * 100
MinValue=0
MaxValue=100

[MeasureDiskDFree]
Measure=FreeDiskSpace
Drive=D:
UpdateDivider=5

[MeasureDiskDTotal]
Measure=FreeDiskSpace
Drive=D:
Total=1
UpdateDivider=5

[MeasureDiskDFreePercent]
Measure=Calc
Formula=(MeasureDiskDFree / MeasureDiskDTotal) * 100
MinValue=0
MaxValue=100

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,375,160,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterCPURingTrack]
Meter=Shape
Shape=Ellipse 70,55,28,28 | Fill Color 0,0,0,1 | Stroke Color 255,255,255,20 | StrokeWidth 5

[MeterCPURingFill]
Meter=Roundline
MeasureName=MeasureCPU
X=42
Y=27
W=56
H=56
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
LineLength=30.5
LineStart=25.5
LineColor=#AccentCyan#
Solid=1
AntiAlias=1

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
X=70
Y=47
StringAlign=Center
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=10.5
StringStyle=Bold
Text="%1%"
AntiAlias=1

[MeterCPULabel]
Meter=String
X=70
Y=102
StringAlign=Center
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=9.5
StringStyle=Bold
Text="CPU Usage"
AntiAlias=1

[MeterCPUSubLabel]
Meter=String
X=70
Y=120
StringAlign=Center
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8
Text="System Processor"
AntiAlias=1

[MeterDivider]
Meter=Shape
Shape=Line 142,20,142,140 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterRAMRingTrack]
Meter=Shape
Shape=Ellipse 192,50,18,18 | Fill Color 0,0,0,1 | Stroke Color 255,255,255,20 | StrokeWidth 3.5

[MeterRAMRingFill]
Meter=Roundline
MeasureName=MeasureRAMFreePercent
X=174
Y=32
W=36
H=36
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
LineLength=19.75
