[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - System Monitor
Author=Rez Creative (Rezamufaris)
Information=System Monitor Widget with FrostedGlass Acrylic effect.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[Variables]
BarColorCPU=0,255,150
BarColorRAM=0,240,255
BarColorDiskC=255,140,0
BarColorDiskD=255,0,128

[MeasureUptime]
Measure=Uptime
Format="%3h %2m"

[MeasureCPU]
Measure=CPU

[MeasureRAMUsed]
Measure=PhysicalMemory
UpdateDivider=2

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=2

[MeasureDiskCUsed]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=5

[MeasureDiskCTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=5

[MeasureDiskDUsed]
Measure=FreeDiskSpace
Drive=D:
InvertMeasure=1
UpdateDivider=5

[MeasureDiskDTotal]
Measure=FreeDiskSpace
Drive=D:
Total=1
UpdateDivider=5

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,375,220,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterTitle]
Meter=String
X=20
Y=15
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=9.5
StringStyle=Bold
Text="SYSTEM MONITOR"
AntiAlias=1

[MeterUptimeText]
Meter=String
MeasureName=MeasureUptime
X=355
Y=15
StringAlign=Right
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="Uptime: %1"
AntiAlias=1

[MeterCPULabel]
Meter=String
X=20
Y=42
FontColor=#TextSecondary#
FontFace=#FontMono#
FontSize=8.5
Text="CPU:"
AntiAlias=1

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
X=60
Y=42
FontColor=#BarColorCPU#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
Text="%1%"
AntiAlias=1

[MeterCPUBarBg]
Meter=Shape
Shape=Rectangle 20,58,335,6,3 | Fill Color 30,40,60,200 | Stroke Width 0

[MeterCPUContainer]
Meter=Shape
Shape=Rectangle 20,58,335,6,3 | Fill Color 255,255,255 | Stroke Width 0

[MeterCPUBarFill]
Meter=Bar
MeasureName=MeasureCPU
Container=MeterCPUContainer
X=20
Y=58
W=335
H=6
BarColor=#BarColorCPU#
BarOrientation=Horizontal

[MeterRAMLabel]
Meter=String
X=20
Y=82
FontColor=#TextSecondary#
FontFace=#FontMono#
FontSize=8.5
Text="RAM:"
AntiAlias=1

[MeterRAMValue]
Meter=String
MeasureName=MeasureRAMUsed
MeasureName2=MeasureRAMTotal
X=60
Y=82
FontColor=#BarColorRAM#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
AutoScale=1
Text="%1 / %2B"
AntiAlias=1

[MeterRAMPercent]
Meter=String
MeasureName=MeasureRAMUsed
X=355
Y=82
StringAlign=Right
FontColor=#BarColorRAM#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
Percentual=1
Text="(%1%)"
AntiAlias=1

[MeterRAMBarBg]
Meter=Shape
Shape=Rectangle 20,98,335,6,3 | Fill Color 30,40,60,200 | Stroke Width 0

[MeterRAMContainer]
Meter=Shape
Shape=Rectangle 20,98,335,6,3 | Fill Color 255,255,255 | Stroke Width 0

[MeterRAMBarFill]
Meter=Bar
MeasureName=MeasureRAMUsed
Container=MeterRAMContainer
X=20
Y=98
W=335
H=6
BarColor=#BarColorRAM#
BarOrientation=Horizontal

[MeterDiskCLabel]
Meter=String
X=20
Y=122
FontColor=#TextSecondary#
FontFace=#FontMono#
FontSize=8.5
Text="Disk (C:):"
AntiAlias=1

[MeterDiskCValue]
Meter=String
MeasureName=MeasureDiskCUsed
MeasureName2=MeasureDiskCTotal
X=85
Y=122
FontColor=#BarColorDiskC#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
AutoScale=1
Text="%1 / %2B"
AntiAlias=1

[MeterDiskCPercent]
Meter=String
MeasureName=MeasureDiskCUsed
X=355
Y=122
StringAlign=Right
FontColor=#BarColorDiskC#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
Percentual=1
Text="(%1%)"
AntiAlias=1

[MeterDiskCBarBg]
Meter=Shape
Shape=Rectangle 20,138,335,6,3 | Fill Color 30,40,60,200 | Stroke Width 0

[MeterDiskCContainer]
Meter=Shape
Shape=Rectangle 20,138,335,6,3 | Fill Color 255,255,255 | Stroke Width 0

[MeterDiskCBarFill]
Meter=Bar
MeasureName=MeasureDiskCUsed
Container=MeterDiskCContainer
X=20
Y=138
W=335
H=6
BarColor=#BarColorDiskC#
BarOrientation=Horizontal

[MeterDiskDLabel]
Meter=String
X=20
Y=162
FontColor=#TextSecondary#
FontFace=#FontMono#
FontSize=8.5
Text="Disk (D:):"
AntiAlias=1

[MeterDiskDValue]
Meter=String
MeasureName=MeasureDiskDUsed
MeasureName2=MeasureDiskDTotal
X=85
Y=162
FontColor=#BarColorDiskD#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
AutoScale=1
Text="%1 / %2B"
AntiAlias=1

[MeterDiskDPercent]
Meter=String
MeasureName=MeasureDiskDUsed
X=355
Y=162
StringAlign=Right
FontColor=#BarColorDiskD#
FontFace=#FontMono#
FontSize=8.5
StringStyle=Bold
Percentual=1
Text="(%1%)"
AntiAlias=1

[MeterDiskDBarBg]
Meter=Shape
Shape=Rectangle 20,178,335,6,3 | Fill Color 30,40,60,200 | Stroke Width 0

[MeterDiskDContainer]
Meter=Shape
Shape=Rectangle 20,178,335,6,3 | Fill Color 255,255,255 | Stroke Width 0

[MeterDiskDBarFill]
Meter=Bar
MeasureName=MeasureDiskDUsed
Container=MeterDiskDContainer
X=20
Y=178
W=335
H=6
BarColor=#BarColorDiskD#
BarOrientation=Horizontal