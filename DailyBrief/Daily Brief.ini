[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - Daily Brief
Author=Rez Creative (Rezamufaris)
Information=Daily Brief Widget with FrostedGlass Acrylic effect.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[Variables]

[MeasureHour]
Measure=Time
Format=%H

[MeasureGreeting]
Measure=Time
Format=%H
IfCondition=(MeasureHour >= 5) && (MeasureHour < 18)
IfTrueAction=[!SetOption MeterGreeting Text "Bonjour, #UserName#!"][!Redraw]
IfFalseAction=[!SetOption MeterGreeting Text "Bonsoir, #UserName#!"][!Redraw]

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,375,130,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterLabel]
Meter=String
X=20
Y=15
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=9
StringStyle=Bold
Text="DAILY BRIEF"
AntiAlias=1

[MeterGreeting]
Meter=String
X=20
Y=43
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=13
StringStyle=Bold
Text="Bonjour, #UserName#!"
AntiAlias=1

[MeterSubText]
Meter=String
X=20
Y=77
W=335
H=50
ClipString=1
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=9
Text="Simplicity is about subtracting the obvious and adding the meaningful."
AntiAlias=1