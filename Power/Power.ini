[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - Power
Author=Rez Creative (Rezamufaris)
Information=Desktop Power Widget with FrostedGlass Acrylic effect.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[Variables]
ColorCharging=0,255,150
ColorDischarging=255,90,90

[MeasurePercent]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[MeasureAC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
Substitute="0":"DISCHARGING","1":"CHARGING"
IfCondition=MeasureAC = 1
IfTrueAction=[!SetOption MeterStatusDot Shape "Ellipse 0,0,4 | Fill Color #ColorCharging# | Stroke Width 0"][!SetOption MeterStatusText FontColor "#ColorCharging#"][!Redraw]
IfFalseAction=[!SetOption MeterStatusDot Shape "Ellipse 0,0,4 | Fill Color #ColorDischarging# | Stroke Width 0"][!SetOption MeterStatusText FontColor "#ColorDischarging#"][!Redraw]

[MeasureStatusText]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
Substitute="0":"Battery Power","1":"AC Connected"

[MeasureSourceText]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
Substitute="0":"Battery","1":"AC Charger"

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,375,175,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterTitle]
Meter=String
X=20
Y=15
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=9.5
StringStyle=Bold
Text="SYSTEM POWER"
AntiAlias=1

[MeterStatusText]
Meter=String
MeasureName=MeasureAC
X=355
Y=14
StringAlign=Right
FontColor=#ColorCharging#
FontFace=#FontMain#
FontSize=8.5
StringStyle=Bold
Text="%1"
AntiAlias=1

[MeterStatusDot]
Meter=Shape
X=(355 - [MeterStatusText:W] - 10)
Y=20
Shape=Ellipse 0,0,4 | Fill Color #ColorCharging# | Stroke Width 0
DynamicVariables=1

[MeterPercentValue]
Meter=String
MeasureName=MeasurePercent
X=20
Y=42
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=22
StringStyle=Bold
Text="%1%"
AntiAlias=1

[MeterSubStatus]
Meter=String
MeasureName=MeasureStatusText
X=355
Y=52
StringAlign=Right
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=9
Text="%1"
AntiAlias=1

[MeterBarBg]
Meter=Shape
Shape=Rectangle 20,88,335,8,4 | Fill Color 30,40,60,200 | Stroke Width 0

[MeterBarFill]
Meter=Shape
MeasureName=MeasurePercent
Shape=Rectangle 20,88,([MeasurePercent]*3.35),8,4 | Fill Color #AccentCyan# | Stroke Width 0
DynamicVariables=1

[MeterDetailBox]
Meter=Shape
Shape=Rectangle 20,108,335,50,10 | Fill Color 25,32,48,90 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterHealthLabel]
Meter=String
X=32
Y=115
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="Health:"
AntiAlias=1

[MeterHealthValue]
Meter=String
X=78
Y=115
FontColor=#AccentGreen#
FontFace=#FontMain#
FontSize=8.5
StringStyle=Bold
Text="Good (100%)"
AntiAlias=1

[MeterModeLabel]
Meter=String
X=195
Y=115
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="Mode:"
AntiAlias=1

[MeterModeValue]
Meter=String
X=235
Y=115
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=8.5
StringStyle=Bold
Text="Balanced"
AntiAlias=1

[MeterSourceLabel]
Meter=String
X=32
Y=135
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="Source:"
AntiAlias=1

[MeterSourceValue]
Meter=String
MeasureName=MeasureSourceText
X=78
Y=135
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=8.5
Text="%1"
AntiAlias=1

[MeterRateLabel]
Meter=String
X=195
Y=135
FontColor=#TextSecondary#
FontFace=#FontMain#
FontSize=8.5
Text="Status:"
AntiAlias=1

[MeterRateValue]
Meter=String
MeasureName=MeasurePercent
X=235
Y=135
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=8.5
Text="%1%"
AntiAlias=1