[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - Calendar Small
Author=Rez Creative (Rezamufaris)
Information=Compact Glassmorphic Calendar Widget with Active Day Circle Indicator.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[MeasureToday]
Measure=Time
Format=%#d

[MeasureMonthYear]
Measure=Time
Format=%B

[MeasureScript]
Measure=Script
ScriptFile=#@#Calendar.lua

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,180,180,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterMonth]
Meter=String
MeasureName=MeasureMonthYear
X=20
Y=16
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=9
StringStyle=Bold
StringCase=Upper
Text="%1"
AntiAlias=1

[MeterTodayCircle]
Meter=Shape
Shape=Ellipse 0,0,10 | Fill Color #AccentCyan# | Stroke Width 0
X=-50
Y=-50
DynamicVariables=1

[HeaderSun]
Meter=String
X=26
Y=40
FontColor=#TextSecondary#
FontFace=#FontMono#
FontSize=8
StringAlign=Center
Text="S"
AntiAlias=1

