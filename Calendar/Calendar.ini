[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Glassify - Calendar
Author=Rez Creative (Rezamufaris)
Information=Full Size Glassmorphic Calendar Widget with Active Day Circle Indicator.
Version=1.0.0
License=Creative Commons

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round
Border=None
BorderVisible=0
UpdateDivider=-1

@includeVariables=#@#Variables.inc

[MeasureToday]
Measure=Time
Format=%#d

[MeasureMonthYear]
Measure=Time
Format=%B %Y

[MeasureScript]
Measure=Script
ScriptFile=#@#Calendar.lua

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,350,210,#CardRadius# | Fill Color 0,0,0,1 | Stroke Color #BorderColor# | StrokeWidth 1

[MeterTitle]
Meter=String
X=20
Y=15
FontColor=#AccentCyan#
FontFace=#FontMain#
FontSize=9.5
StringStyle=Bold
Text="CALENDAR"
AntiAlias=1

[MeterMonthYear]
Meter=String
MeasureName=MeasureMonthYear
X=330
Y=15
StringAlign=Right
FontColor=#TextPrimary#
FontFace=#FontMain#
FontSize=9.5
StringStyle=Bold
Text="%1"
AntiAlias=1

[MeterTodayCircle]
Meter=Shape
Shape=Ellipse 0,0,11 | Fill Color #AccentCyan# | Stroke Width 0
X=-50
Y=-50
DynamicVariables=1

